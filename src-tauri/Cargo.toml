[package]
name = "hunk"
version = "0.0.0"
description = "A local desktop workbench for optical CHD images"
authors = ["Hunk contributors"]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[lib]
name = "hunk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
