[package]
name = "hunk"
version = "0.0.0"
description = "A local desktop workbench for optical CHD images"
authors = ["Hunk contributors"]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[lib]
name = "hunk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
