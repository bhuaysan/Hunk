name: Approved chdman

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and check pinned sidecar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsdl2-dev \
            libwebkit2gtk-4.1-dev \
            python3
      - name: Build pinned chdman
        env:
          HUNK_BUILD_JOBS: 4
        run: ./scripts/build-chdman.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Check version and capabilities through Hunk
        env:
          HUNK_CHDMAN: ${{ github.workspace }}/src-tauri/binaries/chdman-x86_64-unknown-linux-gnu
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --test chdman_process approved_real_binary_reports_required_capabilities -- --ignored
      - name: Run generated fixture round trips
        env:
          HUNK_CHDMAN: ${{ github.workspace }}/src-tauri/binaries/chdman-x86_64-unknown-linux-gnu
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --test end_to_end generated_fixture_round_trip_with_real_chdman -- --ignored --exact
